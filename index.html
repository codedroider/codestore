<script>
  document.getElementById('search-submit-btn').addEventListener('click', doWidgetScroll);
  
  document.getElementById('search-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      doWidgetScroll();
    }
  });

  function doWidgetScroll() {
    const query = document.getElementById('search-input').value.trim().toLowerCase();
    if (!query) return;

    document.querySelectorAll('.download-widget').forEach(w => w.classList.remove('widget-blink'));

    const widgets = document.querySelectorAll('.download-widget');
    let targetWidget = null;

    for (let widget of widgets) {
      if (widget.textContent.toLowerCase().includes(query)) {
        targetWidget = widget;
        break;
      }
    }

    if (targetWidget) {
      targetWidget.scrollIntoView({ behavior: 'smooth', block: 'center' });
      
      targetWidget.classList.add('widget-blink');
      setTimeout(() => {
        targetWidget.classList.remove('widget-blink');
      }, 2000);
    } else {
      alert('Ничего не найдено');
    }
  }
</script>

<script>
  document.querySelectorAll('.download-btn').forEach(function(btn) {
    
    btn.addEventListener('click', function() {
      const currentBtn = this;
      
    
      if (currentBtn.classList.contains('loading')) return;

      const fileUrl = currentBtn.getAttribute('data-href');

      
      currentBtn.classList.add('loading');
      currentBtn.textContent = 'Скачивание началось...';

      
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = fileUrl;
      document.body.appendChild(iframe);

      setTimeout(() => {
        currentBtn.classList.remove('loading');
        currentBtn.textContent = 'Скачать';
        
        if (document.body.contains(iframe)) {
          document.body.removeChild(iframe);
        }
      }, 3000);
    });
    
  });
</script>
